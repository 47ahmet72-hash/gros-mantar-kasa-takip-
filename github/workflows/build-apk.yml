
name: Gros Mantar APK oluştur

on:
  workflow_dispatch:
  push:
    paths:
      - 'Gros_Mantar_Android_APK_Projesi.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android projesini hazırla
        run: |
          mkdir -p /tmp/gros-project
          unzip -o Gros_Mantar_Android_APK_Projesi.zip -d /tmp/gros-project
          PROJECT_DIR=$(find /tmp/gros-project -type f -name settings.gradle -print -quit | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "settings.gradle bulunamadı"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Barkod ve Excel kütüphanelerini ekle
        run: |
          mkdir -p "$PROJECT_DIR/app/src/main/assets/www/js"
          curl -fL 'https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js' -o "$PROJECT_DIR/app/src/main/assets/www/js/zxing.min.js"
          curl -fL 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js' -o "$PROJECT_DIR/app/src/main/assets/www/js/xlsx.full.min.js"

      - name: APK oluştur
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: APK dosyasını paylaş
        uses: actions/upload-artifact@v4
        with:
          name: Gros-Mantar-Kasa-Takip-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
